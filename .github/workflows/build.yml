name: Build DevBuild
on:
    workflow_dispatch:
    push:
        branches:
            - main
        paths:
            - .github/workflows/build.yml
            - src/**
            - browser/**
            - scripts/build/**
            - installer/**
            - package.json
            - pnpm-lock.yaml
env:
    FORCE_COLOR: true

permissions:
    contents: write

jobs:
    Build:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7

            - uses: pnpm/action-setup@v6 # Install pnpm using packageManager key in package.json

            - name: Use Node.js 24
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build
              run: pnpm build --standalone

            - name: Clean up obsolete files
              run: |
                  rm -rf dist/*-unpacked dist/vendor vencordDesktopRenderer.css vencordDesktopRenderer.css.map

            - name: Get some values needed for the release
              run: |
                  echo "release_tag=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

            # The in-app updater and the installer both download from the "latest" release,
            # and read the commit hash from the last word of its title
            - name: Upload DevBuild as release
              run: |
                  gh release view devbuild >/dev/null 2>&1 || gh release create devbuild --title "DevBuild $RELEASE_TAG" --notes "Latest Chordline build. Download ChordlineInstaller.exe below to install."
                  gh release upload devbuild --clobber dist/*
                  gh release edit devbuild --title "DevBuild $RELEASE_TAG"
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  RELEASE_TAG: ${{ env.release_tag }}

    Installer:
        needs: Build
        runs-on: windows-latest

        steps:
            - uses: actions/checkout@v7

            - name: Compile installer
              run: ./installer/build.ps1

            - name: Upload installer to release
              run: gh release upload devbuild --clobber installer/bin/ChordlineInstaller.exe
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
